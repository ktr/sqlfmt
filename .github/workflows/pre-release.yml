name: pre-release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-pre-release:
    name: build (${{ matrix.friendly_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - friendly_name: linux64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - friendly_name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - friendly_name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - friendly_name: windows64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run Tests
        run: cargo test --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build archive
        shell: bash
        run: |
          staging="pgsqlfmt-latest-${{ matrix.friendly_name }}"
          mkdir -p "$staging"
          [ -f README.md ] && cp README.md "$staging/"
          [ -f LICENSE.txt ] && cp LICENSE.txt "$staging/"
          [ -f LICENSE ] && cp LICENSE "$staging/"

          if [[ "${{ matrix.os }}" == windows* ]]; then
            cp "target/${{ matrix.target }}/release/pgsqlfmt.exe" "$staging/"
            (cd "$staging" && 7z a "../$staging.zip" *)
            echo "ASSET=$staging.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/pgsqlfmt" "$staging/"
            COPYFILE_DISABLE=1 tar czf "$staging.tar.gz" -C "$staging" .
            echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload to pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Development Release
          prerelease: true
          make_latest: "false"
          files: ${{ env.ASSET }}
